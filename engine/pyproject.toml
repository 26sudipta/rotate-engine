[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotate_engine"
version = "0.1.0"
description = "ROTATE analog-year engine (NASA Space Apps 2026, Field Shift)"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.1.1",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "pydantic==2.14.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "jsonschema==4.26.0", "requests==2.34.2", "requests-cache==1.3.3", "tenacity==9.2.1"]
scripts = ["requests==2.34.2", "requests-cache==1.3.3", "tenacity==9.2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
